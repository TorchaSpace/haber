<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e10" />
  <title>Haber</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script>
    try { const t = localStorage.getItem('haber.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <div class="progress" id="progress"></div>

  <div class="chrome" id="chrome">
  <header class="topbar" id="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Haber</span>
    </div>

    <label class="search" id="search-wrap">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Dünyada ne oluyor?" autocomplete="off" />
      <kbd>/</kbd>
    </label>

    <div class="actions">
      <button class="icon-btn" id="refresh" title="Yenile" aria-label="Yenile">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="theme" title="Tema" aria-label="Temayı değiştir">
        <svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="icon-btn" id="open-prefs" title="Tercihlerim" aria-label="Tercihlerim">
        <svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs-wrap">
    <div class="tabs" id="tabs" role="tablist">
      <span class="tab-indicator" id="tab-indicator"></span>
    </div>
  </nav>
  </div>

  <section class="greeting" id="greeting">
    <h1 id="greeting-title">Merhaba</h1>
    <p id="greeting-sub"></p>
  </section>

  <main id="feed" class="feed"></main>

  <button class="to-top" id="to-top" aria-label="Yukarı çık">
    <svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

  <!-- Okuma paneli -->
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <article class="sheet" id="sheet" aria-modal="true" role="dialog">
    <div class="sheet-handle"></div>
    <div class="sheet-body" id="sheet-body"></div>
  </article>

  <!-- Tercih paneli -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Tercihler">
    <div class="drawer-head">
      <h2>Tercihlerim</h2>
      <button class="icon-btn" id="close-prefs" aria-label="Kapat"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <h3>İlgi alanların</h3>
    <div class="chips" id="cat-list"></div>
    <h3>Diller</h3>
    <div class="chips" id="lang-list"></div>
    <h3>Takip ettiğin konular</h3>
    <div class="kw-input">
      <input id="kw-input" placeholder="Bir konu yaz, Enter'a bas" />
    </div>
    <div class="chips" id="kw-list"></div>
    <p class="hint">Bu konuları içeren haberler "Sana Özel" akışında en üstte çıkar.</p>
  </aside>

  <!-- İlk açılış -->
  <div class="onboard" id="onboard" hidden>
    <div class="onboard-card">
      <span class="onboard-emoji">🌍</span>
      <h2>Dünya, senin zevkine göre.</h2>
      <p>Neleri merak ediyorsun? Birkaç tane seç, akışını ona göre kuralım.</p>
      <div class="chips big" id="onboard-cats"></div>
      <button class="primary" id="onboard-go" disabled>Başlayalım</button>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script src="app.js"></script>
</body>
</html>
